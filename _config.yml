baseurl: ""
url: "https://www.lectura.world"

title: Lectura
description: "Lectura développe des outils pour la lecture du français : analyse du langage (NLP), synthèse et reconnaissance vocales, lexique de plus de deux millions d'entrées et outils pédagogiques pour l'apprentissage de la lecture."
lang: fr
theme: minima

plugins:
  - jekyll-redirect-from
  - jekyll-feed

# Articles (blog de Découvrir et Nouveautés de l'accueil ; Maxime, 11/11/2026)
feed:
  path: /articles/feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      permalink: /articles/:title/
