  <desc id="sa-desc">Le fondateur oriente une session de direction, qui coordonne quatre groupes d'agents d'IA : Techno (Modèles, Corpus, NLP, TTS, STT), Sites (LecturaWorld, LecturaLexique, LecturaLingua, LecturaVoice, Serveur), Produits (Ressources avec les corpus Syllabes et Mots, Méthode syllabique) et Communs (Sauvegardes, Guichet pour la mémoire et le GPU). L'arborescence évolue : d'autres agents s'ajoutent selon les tâches.</desc>
