  <title id="se-titre">L'écosystème du projet Lectura</title>
  <desc id="se-desc">Trois couches. En haut, les produits : outils (programmes, applications), éducatif (méthode, applications), divertissement (jeux, livres). Au milieu, les modules : la phonétique au centre relie le texte (LecturaLingua, à gauche) et la voix (LecturaVoice, à droite), par G2P et P2G d'un côté, TTS et STT de l'autre ; les produits réutilisent ces modules. En bas, les données : le lexique LeXiK, qui entraîne les modules de texte, les corpus d'entraînement, qui servent au texte et à la voix, et les corpus pédagogiques, faits avec les voix de synthèse et utilisés par les produits ; LeXiK alimente aussi les deux corpus.</desc>
