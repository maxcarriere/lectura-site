  <desc id="se-desc">La phonétique au centre relie le texte (LecturaLingua, à gauche) et la voix (LecturaVoice, à droite) : G2P et P2G entre le texte et la phonétique, TTS et STT entre la phonétique et la voix. Le lexique LeXiK, en bas, fournit les données d'entraînement des modules de texte. Les produits, en haut, réutilisent ces briques.</desc>
