{%- comment -%} Petit drapeau d'une langue gérée (include.langue : fr, en). SVG simplifiés, pas d'émoji (Windows les affiche en lettres). {%- endcomment -%}

{%- when 'en' -%}<svg viewBox="0 0 60 30" class="drapeau" role="img" aria-label="anglais"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2.4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg>
{%- endcase -%}
