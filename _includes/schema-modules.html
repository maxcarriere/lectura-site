  <title id="sm-titre">Ressources, modules et productions de Lectura</title>
  <desc id="sm-desc">À gauche, les ressources : le lexique LeXiK, les textes annotés (Universal Dependencies) et des corpus de parole publics. Au centre, les modules de la génération actuelle : pour le texte, Transducer, Lexicon, Corrector et Translator ; pour la voix, Synthesizer, Decoder, Aligner et Subtitler ; la phonétique passe du texte à la voix. Les modules de texte enrichissent LeXiK et préparent les corpus de parole. À droite, les productions : les corpus produits et les sites de démo.</desc>
