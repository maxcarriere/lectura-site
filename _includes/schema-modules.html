  <title id="sm-titre">L'écosystème modulaire de Lectura</title>
  <desc id="sm-desc">Trois représentations : le texte, la phonétique et la voix. Le Tagger (la phrase) et le Transducer (les mots) passent du texte à la phonétique et inversement ; le Synthesizer de la phonétique à la voix ; le Decoder de la voix à la phonétique. Autour, reliés aux modules dont ils dépendent : Translator, Corrector et Lexicon (Lexicon sert aussi au Corrector), Aligner (au Decoder) et Subtitler (au Decoder ou au Synthesizer). Les métiers composent ces briques : NLP-FR et NLP-EN, en trois niveaux, Analyseur, Correcteur, Traducteur (Tagger + Transducer + Lexicon, plus Corrector et Translator), sur LecturaLingua ; TTS, la synthèse vocale (Tagger + Transducer puis Synthesizer), STT, la reconnaissance vocale (Decoder puis Transducer et Tagger, Aligner en option), STS, le sous-titrage (Decoder et Aligner, ou Synthesizer, puis Subtitler), sur LecturaVoice. Le lexique LeXiK entraîne le Transducer et nourrit Lexicon ; des textes annotés entraînent le Tagger ; des corpus de parole entraînent le Synthesizer et le Decoder.</desc>
