<figure class="schema-ecosysteme">

  <title id="sm-titre">L'écosystème modulaire de Lectura</title>
  <desc id="sm-desc">Trois représentations : le texte, la phonétique et la voix. Le Transducer passe du texte à la phonétique et inversement ; le Synthesizer de la phonétique à la voix ; le Decoder de la voix à la phonétique. Autour : Corrector, Translator, Lexicon, Aligner et Subtitler. Les métiers composent ces briques : NLP (Transducer, Lexicon, Corrector, Translator), TTS (Transducer puis Synthesizer), STT (Decoder puis Transducer), STS (Aligner puis Subtitler). Le lexique LeXiK entraîne le modèle de mot du Transducer et nourrit Lexicon ; des textes annotés entraînent l'analyse grammaticale ; des corpus de parole entraînent le Synthesizer et le Decoder.</desc>
